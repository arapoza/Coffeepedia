<form hx-post="{% url 'beans:edit_review' review.id %}" hx-target="#reviews" hx-on="htmx:afterRequest: this.remove()">
    {% csrf_token %}
    <h3>Add Review for {{ bean.name }}</h3>
    <div>
        <label for="rating">Rating (1-5):</label>
        {{ review_form.rating }}
    </div>
    <div>
        <label for="content">Review:</label>
        {{ review_form.content }}
    </div>
    <button type="submit">Edit Review</button>
</form>
