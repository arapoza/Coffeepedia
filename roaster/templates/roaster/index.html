{% extends "coffeepedia/base.html" %}

{% block title %}
<h2>Roaster List</h2>
{% endblock %}

{% block content %}
<div id="roaster-list">
{% if roaster_list %}
    <ul>
    {% for roaster in roaster_list %}
    <li><a href="{% url 'roaster:detail' roaster.id %}">{{ roaster.name }}</a></li>
    {% endfor %}
    </ul>
{% else %}
    <p>No roasters are available.</p>
{% endif %}
</div>
<div id="roaster-button">
    <button hx-get="{% url 'roaster:add_roaster' %}" hx-target="#add-roaster-form" hx-swap="innerHTML">
    Add Roaster
    </button>
</div>
<div id="add-roaster-form"></div>
{% endblock %}
